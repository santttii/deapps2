# Configuración común a todos los servicios (viene dentro de palco-common).

# --- Tokens JWT --------------------------------------------------------------
# ServicioDeUsuarios firma los tokens y publica su clave pública en /jwks;
# cada servicio la descarga de ahí para verificar las firmas.
# PALCO_URL_INTERNA: dirección del WildFly donde corre ServicioDeUsuarios.
mp.jwt.verify.publickey.location=${PALCO_URL_INTERNA:http://localhost:8080}/api/usuarios/jwks
mp.jwt.verify.issuer=palco
# Volver a pedir la clave seguido: en desarrollo cambia cada vez que se redespliega Usuarios.
smallrye.jwt.jwks.refresh-interval=1
smallrye.jwt.jwks.forced-refresh-interval=0
