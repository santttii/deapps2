# Análisis de SonarCloud de Palco (organización santttii, proyecto santttii_deapps2, público).
#
# Lo corre el job "sonar" de .github/workflows/ci.yml en cada corrida del CI, salvo en los pull requests que vienen
# de un fork: primero "mvn verify" (compila, corre los tests y deja la cobertura de JaCoCo) y después el escáner, que
# lee este archivo. El análisis automático de SonarCloud tiene que estar apagado (Administration > Analysis Method):
# no se pueden tener los dos.
#
# Las rutas son desde la raíz del repo. sonar.sources y sonar.tests no aceptan comodines, por eso cada módulo
# del backend va con su carpeta; las propiedades de Java y de cobertura sí los aceptan.

sonar.projectKey=santttii_deapps2
sonar.organization=santttii
sonar.sourceEncoding=UTF-8

# ------------------------------------------------------------------ código de la aplicación
# Lo que se despliega: el src/main de cada módulo del backend (common, los nueve servicios y el ARCA simulado,
# que corre en el mismo WildFly), el frontend (frontend/src y su index.html) y lo que arma y levanta el sistema:
# los Dockerfile, docker-compose.yml, los guiones de arranque, la configuración de nginx y los workflows del CI.
# Así los hallazgos de esa infraestructura (permisos, descargas, imágenes) también cuentan.
sonar.sources=\
  backend/common/src/main,\
  backend/servicios/arca/src/main,\
  backend/servicios/asistente/src/main,\
  backend/servicios/eventos/src/main,\
  backend/servicios/facturacion/src/main,\
  backend/servicios/notificaciones/src/main,\
  backend/servicios/pagos/src/main,\
  backend/servicios/reventa/src/main,\
  backend/servicios/usuarios/src/main,\
  backend/servicios/validacion/src/main,\
  backend/servicios/ventas/src/main,\
  backend/Dockerfile,\
  backend/docker,\
  backend/dev.sh,\
  backend/redesplegar.sh,\
  frontend/src,\
  frontend/index.html,\
  frontend/Dockerfile,\
  frontend/docker,\
  docker-compose.yml,\
  .github

# ------------------------------------------------------------------ código de prueba
# Los tests del backend (src/test de cada módulo, con los guiones "en vivo" de src/test/en-vivo), las pruebas E2E
# del frontend (frontend/e2e) y scripts/ entero: la prueba de integración y las de seguridad, ETag y asistente
# (scripts/pruebas), la de carga (scripts/carga), el generador de la colección de Postman (scripts/postman) y los
# resúmenes que arma el CI (scripts/qa). Sonar los analiza como código de prueba, con las reglas para tests: las
# credenciales de las cuentas de prueba, los DNI al azar o las URL que se leen del entorno no son un riesgo de la
# aplicación.
sonar.tests=\
  backend/common/src/test,\
  backend/servicios/arca/src/test,\
  backend/servicios/asistente/src/test,\
  backend/servicios/eventos/src/test,\
  backend/servicios/facturacion/src/test,\
  backend/servicios/notificaciones/src/test,\
  backend/servicios/pagos/src/test,\
  backend/servicios/reventa/src/test,\
  backend/servicios/usuarios/src/test,\
  backend/servicios/validacion/src/test,\
  backend/servicios/ventas/src/test,\
  frontend/e2e,\
  scripts

# Fuera del análisis: docs/ (documentos y evidencias de entregas que ya pasaron, que no se cambian; el único
# guion de Python del repo genera un diagrama de ahí), las dependencias instaladas y lo que genera Maven. Entre las
# pruebas, además, lo que deja la prueba de carga en scripts/carga/resultados (las cuentas que crea y su reporte).
sonar.exclusions=docs/**,**/node_modules/**,**/target/**
sonar.test.exclusions=**/node_modules/**,**/target/**,scripts/carga/resultados/**

# En lo que se analiza no hay Python; la versión se fija igual para que, si se agrega un guion, se analice con la
# del CI y no con la que Sonar supone.
sonar.python.version=3.12

# ------------------------------------------------------------------ Java
# El código compilado lo deja "mvn verify" en target/ de cada módulo. Las bibliotecas son las que van dentro de
# cada WAR (WEB-INF/lib) y, de ~/.m2, las API que pone WildFly (Jakarta EE y MicroProfile, con scope provided, que
# por eso no están en el WAR). Con ellas Sonar conoce los tipos de cada llamada y no tiene que adivinarlos.
sonar.java.source=25
sonar.java.jdkHome=${env.JAVA_HOME}
sonar.java.binaries=backend/common/target/classes,backend/servicios/*/target/classes
sonar.java.libraries=\
  backend/servicios/*/target/*/WEB-INF/lib/*.jar,\
  ${env.HOME}/.m2/repository/jakarta/**/*.jar,\
  ${env.HOME}/.m2/repository/org/eclipse/microprofile/**/*.jar
sonar.java.test.binaries=backend/common/target/test-classes,backend/servicios/*/target/test-classes
sonar.java.test.libraries=\
  ${sonar.java.libraries},\
  ${env.HOME}/.m2/repository/org/junit/**/*.jar,\
  ${env.HOME}/.m2/repository/org/mockito/**/*.jar,\
  ${env.HOME}/.m2/repository/org/opentest4j/**/*.jar

# ------------------------------------------------------------------ cobertura
# El reporte XML de JaCoCo de cada módulo. "mvn verify" lo deja junto al jacoco.csv del que scripts/qa/cobertura.mjs
# arma el resumen del job backend: es el mismo reporte en otro formato.
sonar.coverage.jacoco.xmlReportPaths=\
  backend/common/target/site/jacoco/jacoco.xml,\
  backend/servicios/*/target/site/jacoco/jacoco.xml
# La cobertura se mide sobre el Java del backend, que es el que tiene tests unitarios y de integración con JaCoCo.
# El frontend no tiene tests unitarios (sus pruebas son las E2E, que no miden cobertura) y el resto de lo que se
# analiza (Dockerfile, compose, guiones de shell, workflows) no es código que un test recorra: contarlos como
# "sin cubrir" bajaría el número sin decir nada del código de negocio.
sonar.coverage.exclusions=\
  frontend/**,\
  .github/**,\
  **/Dockerfile,\
  docker-compose.yml,\
  **/*.sh
