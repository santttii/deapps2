# Análisis de SonarCloud de Palco (organización santttii, proyecto santttii_deapps2, público).
#
# Lo corre el job "sonar" de .github/workflows/ci.yml en cada corrida del CI, salvo en los pull requests que vienen
# de un fork: primero "mvn verify" (compila, corre los tests y deja la cobertura de JaCoCo) y después el escáner, que
# lee este archivo. El análisis automático de SonarCloud tiene que estar apagado (Administration > Analysis Method):
# no se pueden tener los dos.
#
# Las rutas son desde la raíz del repo y aceptan comodines.

sonar.projectKey=santttii_deapps2
sonar.organization=santttii
sonar.sourceEncoding=UTF-8

# ------------------------------------------------------------------ qué se analiza
# SonarCloud analiza con su alcance nuevo ("new analysis scope"): toma el repo entero y no lee sonar.sources,
# sonar.tests ni sonar.test.exclusions (el escáner lo avisa: "configured but have no effect"). Por eso no están acá.
# Ese alcance tampoco separa el código de prueba del de la aplicación: si los tests quedaran adentro, Sonar los
# trataría como código que se despliega. Contaría como "sin cubrir" el propio código de los tests y marcaría como
# vulnerabilidad lo que en una prueba es a propósito, como las contraseñas de las cuentas de prueba o las URL que
# se leen del entorno. La única forma de sacarlos que respeta es sonar.exclusions.
#
# Queda adentro lo que se despliega o arma el sistema: el src/main de cada módulo del backend (common, los nueve
# servicios y el ARCA simulado), el frontend (frontend/src y su index.html), los Dockerfile, docker-compose.yml, los
# guiones de arranque, la configuración de nginx y los workflows del CI. Así los hallazgos de esa infraestructura
# (permisos, descargas, imágenes) también cuentan.
#
# Queda afuera:
#   **/src/test/**              los tests del backend (unitarios, de integración y los guiones "en vivo")
#   frontend/e2e/**             las pruebas E2E del frontend con Playwright...
#   frontend/playwright.config.ts   ...y su configuración
#   scripts/**                  la prueba de integración y las de seguridad, ETag y asistente (scripts/pruebas), la
#                               de carga (scripts/carga), el generador de la colección de Postman (scripts/postman)
#                               y los guiones y resúmenes que usa el CI (scripts/qa)
#   docs/**                     documentos y evidencias de entregas que ya pasaron, que no se cambian
#   node_modules y target       las dependencias instaladas y lo que genera Maven
# El código de prueba no queda sin control: se valida corriéndolo en el CI (mvn verify, los jobs de integración,
# E2E, API, contrato, seguridad y carga), y si una prueba está mal, su job falla.
sonar.exclusions=\
  **/src/test/**,\
  frontend/e2e/**,\
  frontend/playwright.config.ts,\
  scripts/**,\
  docs/**,\
  **/node_modules/**,\
  **/target/**

# En lo que se analiza no hay Python; la versión se fija igual para que, si se agrega un guion, se analice con la
# del CI y no con la que Sonar supone.
sonar.python.version=3.12

# ------------------------------------------------------------------ Java
# El código compilado lo deja "mvn verify" en target/ de cada módulo. Las bibliotecas son las que van dentro de
# cada WAR (WEB-INF/lib) y, de ~/.m2, las API que pone WildFly (Jakarta EE y MicroProfile, con scope provided, que
# por eso no están en el WAR). Con ellas Sonar conoce los tipos de cada llamada y no tiene que adivinarlos.
# No van sonar.java.test.binaries ni sonar.java.test.libraries: los tests están fuera del análisis.
sonar.java.source=25
sonar.java.jdkHome=${env.JAVA_HOME}
sonar.java.binaries=backend/common/target/classes,backend/servicios/*/target/classes
sonar.java.libraries=\
  backend/servicios/*/target/*/WEB-INF/lib/*.jar,\
  ${env.HOME}/.m2/repository/jakarta/**/*.jar,\
  ${env.HOME}/.m2/repository/org/eclipse/microprofile/**/*.jar

# ------------------------------------------------------------------ cobertura
# El reporte XML de JaCoCo de cada módulo. "mvn verify" lo deja junto al jacoco.csv del que scripts/qa/cobertura.mjs
# arma el resumen del job backend: es el mismo reporte en otro formato. Mide lo que recorren los tests sobre el
# src/main de cada módulo; los tests en sí ya están fuera del análisis, así que no cuentan como código sin cubrir.
sonar.coverage.jacoco.xmlReportPaths=\
  backend/common/target/site/jacoco/jacoco.xml,\
  backend/servicios/*/target/site/jacoco/jacoco.xml
# La cobertura se mide sobre el Java del backend, que es el que tiene tests unitarios y de integración con JaCoCo.
# El frontend no tiene tests unitarios (sus pruebas son las E2E, que no miden cobertura) y el resto de lo que se
# analiza (Dockerfile, compose, guiones de shell, workflows, la configuración de Lighthouse) no es código que un
# test recorra: contarlos como "sin cubrir" bajaría el número sin decir nada del código de negocio.
sonar.coverage.exclusions=\
  frontend/**,\
  .github/**,\
  **/Dockerfile,\
  docker-compose.yml,\
  **/*.sh,\
  .lighthouserc.cjs
