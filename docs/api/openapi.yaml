openapi: 3.1.0
info:
  title: Palco API
  version: 1.2.0
  description: >
    API REST de Palco, plataforma de venta de entradas con reventa oficial (tope +10%).
    Montos en pesos enteros. Fechas ISO 8601: las de Ventas en UTC (`2026-10-14T18:53:50Z`); la fecha del evento,
    en hora local del lugar y sin zona (`2026-12-26T17:00:00`). Errores en formato Problem Details (RFC 9457),
    con `type` de la forma `/problemas/<tipo>`. Cualquier operación puede responder 500
    (`/problemas/error-inesperado`, ver `components.responses.ErrorInesperado`), con un `idError` que también queda
    en el log del servidor.


    Cada servicio es un WAR con su propia raíz: Usuarios en `/api/usuarios`, Eventos en `/api/eventos`, Ventas en
    `/api/v1` (recursos `ventas` y `entradas`) y Pagos en `/api/v1/pagos`. Usuarios y Eventos todavía no pasaron a
    `/api/v1`, Validación en `/api/v1/validacion`, Reventa en `/api/v1/reventas` y Facturación en `/api/v1/facturas`.
    Las rutas de abajo son relativas a `/api`. Cada servicio responde además `GET <su raíz>/health`.
    ARCA (simulado) es un servicio SOAP aparte, en `/legado/arca` (WSDL en `/legado/arca?wsdl`), que solo llama
    Facturación: no forma parte de esta API REST.


    Las operaciones de la etiqueta `interno` y las de `pagos` son de uso entre servicios: requieren un token de rol
    `servicio` y el frontend nunca las llama.
    Notificaciones expone operaciones internas de desarrollo (`/api/notificaciones/pruebas/*`, `auditoria`) que no
    forman parte de este contrato.
servers:
  - url: http://localhost:8080/api
    description: Desarrollo (WildFly local)
  - url: https://api.palco.example/api
    description: Producción (ejemplo)
security:
  - bearerAuth: []
tags:
  - name: usuarios
  - name: eventos
  - name: ventas
  - name: pagos
    description: Uso interno. Solo lo llama Ventas, con un token de rol `servicio`.
  - name: reventas
  - name: validacion
    description: Validación en puerta. Escanea el personal de puerta (rol `staff`).
  - name: facturas
    description: Factura electrónica de cada compra, con el CAE de ARCA (simulado).
  - name: interno
    description: Uso interno de Ventas. Solo las llaman Validación y Reventa, con un token de rol `servicio`.

paths:
  /usuarios/registro:
    post:
      tags: [usuarios]
      summary: Registrar una cuenta y mandar el código de verificación por email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Registro' }
      responses:
        '201':
          description: Cuenta creada sin verificar; el código se manda al email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroPendiente' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }

  /usuarios/verificacion:
    post:
      tags: [usuarios]
      summary: Confirmar el email con el código de 6 dígitos e iniciar la sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Verificacion' }
      responses:
        '200':
          description: Email verificado; devuelve la sesión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400':
          description: Código incorrecto, vencido o con demasiados intentos (`errores.codigo`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: El email ya estaba verificado (`/problemas/conflicto`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /usuarios/verificacion/reenvio:
    post:
      tags: [usuarios]
      summary: Pedir un código de verificación nuevo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reenvio' }
      responses:
        '204':
          description: Código reenviado
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '409':
          description: Hay que esperar 30 segundos entre un pedido y otro (`/problemas/conflicto`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /usuarios/login:
    post:
      tags: [usuarios]
      summary: Iniciar sesión con email y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200':
          description: Sesión iniciada; el token dura 8 horas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401':
          description: Email o contraseña incorrectos (`/problemas/no-autenticado`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: La cuenta todavía no verificó su email (`/problemas/conflicto`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '429':
          description: >
            Ese email tuvo 5 inicios de sesión fallidos en los últimos 15 minutos (`/problemas/demasiados-intentos`).
            Se responde aunque la contraseña sea la correcta y también para emails sin cuenta, con el mismo texto.
            `Retry-After` dice en cuántos segundos sale de la ventana el fallido más viejo y se puede volver a probar.
          headers:
            Retry-After:
              description: Segundos que faltan para poder volver a intentar (nunca menos de 1)
              schema: { type: integer, minimum: 1, example: 600 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: /problemas/demasiados-intentos
                title: Demasiados intentos
                status: 429
                detail: Hubo demasiados intentos fallidos. Esperá unos minutos y volvé a probar.
                instance: /api/usuarios/login
        '500': { $ref: '#/components/responses/ErrorInesperado' }

  /usuarios/yo:
    get:
      tags: [usuarios]
      summary: Datos del usuario del token
      description: Roles `user`, `organizer` o `staff`. Ventas lo consulta antes de iniciar una compra.
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /usuarios/servicios/token:
    post:
      tags: [usuarios]
      summary: Emitir un token de rol `servicio` para las llamadas entre servicios
      description: No pide token; lo protege el secreto compartido. El token dura 5 minutos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Secreto' }
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenDeServicio' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401':
          description: El secreto no es correcto (`/problemas/no-autenticado`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /usuarios/jwks:
    get:
      tags: [usuarios]
      summary: Clave pública para verificar los tokens (JWKS)
      description: Los demás servicios la usan para validar la firma RS256 de los tokens.
      security: []
      responses:
        '200':
          description: Conjunto de claves en formato JWK Set (RFC 7517)
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { type: object, additionalProperties: true }

  /eventos:
    get:
      tags: [eventos]
      summary: Catálogo de eventos
      security: []                       # catálogo público
      parameters:
        - name: categoria
          in: query
          required: false
          schema: { type: string, example: Música }
        - name: q
          in: query
          required: false
          description: Texto a buscar en el título o el lugar, sin distinguir mayúsculas ni acentos
          schema: { type: string }
      responses:
        '200':
          description: Eventos que cumplen los filtros (lista vacía si no hay)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Evento' }
        '400':
          description: La categoría no existe (`/problemas/datos-invalidos`, `errores.categoria`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
    post:
      tags: [eventos]
      summary: Crear un evento con sus sectores
      description: Requiere rol `organizer`. El evento queda a nombre de quien lo crea.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoEvento' }
      responses:
        '201':
          description: Evento creado
          headers:
            Location:
              schema: { type: string, example: http://localhost:8080/api/eventos/recital-de-prueba }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evento' }
        '400':
          description: >
            Cuerpo ausente o mal formado, o campos inválidos (`/problemas/datos-invalidos`, con `errores` por campo).
            Una `fechaISO` que no es futura responde con `errores.fechaISO`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /eventos/{slug}:
    get:
      tags: [eventos]
      summary: Detalle de un evento con sus sectores y cupo disponible
      description: >
        La respuesta todavía no lleva `ETag` ni atiende `If-None-Match` (304). Diseñado, pendiente: no implementado
        al 14/10.
      security: []                       # catálogo público
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: atletico-norte-racing-sur }
      responses:
        '200':
          description: Evento encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evento' }
        '404':
          description: Evento inexistente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /eventos/{eventoId}/sectores/{sectorId}/cupo:
    post:
      tags: [eventos]
      summary: Reservar o liberar lugares de un sector
      description: >
        Requiere rol `servicio`: lo llama Ventas. `cantidad` positiva suma vendidas (reserva) y negativa las resta
        (libera). La actualización es atómica en la base: dos pedidos por el último lugar no pueden pasar los dos.
        Una devolución con `clave` es segura de repetir: si esa clave ya se aplicó, no resta otra vez y responde 200
        con el sector como está.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: string, example: ev-1 }
        - name: sectorId
          in: path
          required: true
          schema: { type: string, example: sec-1-1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioCupo' }
      responses:
        '200':
          description: Sector con el cupo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sector' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: >
            No quedan lugares o se quiere liberar más de lo vendido (`/problemas/conflicto`), se quiere reservar
            cupo de un evento que ya empezó (`/problemas/evento-finalizado`), otro pedido con la misma clave aplicó
            esa devolución al mismo tiempo (`/problemas/devolucion-ya-aplicada`, para quien devuelve es un éxito) o la
            clave ya se usó para otro sector o con otra cantidad (`/problemas/clave-reutilizada`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/ventas:
    post:
      tags: [ventas]
      summary: Iniciar una compra y reservar el cupo durante 10 minutos
      description: >
        Requiere rol `user`. Ventas consulta `GET /usuarios/yo` con el token del comprador y rechaza la compra si la
        cuenta figura sin identidad verificada. Es idempotente por `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaVenta' }
      responses:
        '201':
          description: Compra iniciada, cupo reservado
          headers:
            Location:
              schema: { type: string, example: http://localhost:8080/api/v1/ventas/V-3f9a1c2b }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venta' }
        '400':
          description: Cuerpo mal formado, campos inválidos o `Idempotency-Key` ausente o que no es UUID (`/problemas/datos-invalidos`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: El rol no es `user` (`/problemas/sin-permiso`) o la cuenta no tiene la identidad verificada (`/problemas/identidad-no-verificada`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: >
            El sector no tiene cupo suficiente (`/problemas/cupo-agotado`), el evento ya empezó
            (`/problemas/evento-finalizado`), la misma clave está en uso por un pedido que todavía no terminó
            (`/problemas/operacion-en-curso`) o la misma clave ya abrió una compra con otro pedido
            (`/problemas/clave-reutilizada`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422':
          description: >
            Viola una regla de negocio: más de 6 entradas (`/problemas/maximo-de-entradas`), DNI repetido
            (`/problemas/dni-repetido`), titulares que no coinciden con la cantidad (`/problemas/titulares-no-coinciden`)
            o sector que no es del evento (`/problemas/sector-inexistente`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: /problemas/maximo-de-entradas
                title: Regla de negocio incumplida
                status: 422
                detail: Se pueden comprar hasta 6 entradas por compra.
                instance: /api/v1/ventas
        '504': { $ref: '#/components/responses/SinRespuesta' }
    get:
      tags: [ventas]
      summary: Compras del usuario autenticado
      description: >
        Requiere rol `user`. Devuelve las ventas del dueño del token (claim `sub`), de la más nueva a la más vieja, en
        todos los estados y con sus entradas. No recibe id de usuario, así que nadie puede pedir las de otro. Sin
        paginación ni filtros.
      responses:
        '200':
          description: Lista de compras (vacía si no compró nada)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Venta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /v1/ventas/{ventaId}:
    parameters:
      - $ref: '#/components/parameters/VentaId'
    get:
      tags: [ventas]
      summary: Estado de una compra propia
      description: Requiere rol `user`. Una venta de otro usuario responde 404, para no revelar que existe.
      responses:
        '200':
          description: Venta encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [ventas]
      summary: Cancelar una compra en checkout y liberar el cupo
      description: Requiere rol `user`. Repetirlo sobre una venta ya cancelada o vencida también responde 204.
      responses:
        '204':
          description: Venta cancelada
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La venta ya está paga (`/problemas/venta-ya-paga`) o tiene un pago en curso (`/problemas/operacion-en-curso`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/ventas/{ventaId}/pagos:
    post:
      tags: [ventas]
      summary: Pagar una compra en checkout
      description: >
        Requiere rol `user`. Ventas cobra con `POST /v1/pagos` (pasarela simulada, por REST) y, si el pago se aprueba,
        publica `PAGO_CONFIRMADO` en la misma transacción (cola `emisionEntradas` y tópico `compraConfirmada`); las
        entradas se emiten de forma asincrónica. Es idempotente por `Idempotency-Key`.
        La factura la emite Facturación de forma asincrónica, al consumir el tópico (ver `GET /v1/facturas/{ventaId}`);
        `facturaEstado` de la venta queda en `NO_APLICA`. El cobro con Mercado Pago está diseñado, pendiente.
        Si después del cobro aprobado algo falla y la confirmación se deshace, la venta queda `EN_CHECKOUT` con el
        intento anotado y la conciliación de pagos de Ventas (una vez por minuto, con 2 minutos de margen) le pregunta
        a Pagos por la clave (`GET /v1/pagos?claveIdempotencia=`) y la confirma o la vence.
      parameters:
        - $ref: '#/components/parameters/VentaId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoPago' }
      responses:
        '201':
          description: Pago aprobado. La venta queda CONFIRMADA y las entradas se emiten de forma asincrónica.
          headers:
            Location:
              schema: { type: string, example: http://localhost:8080/api/v1/ventas/V-3f9a1c2b/pagos/P-8c21d0e4 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venta' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '402':
          description: Pago rechazado por la pasarela (`/problemas/pago-rechazado`). La venta sigue en checkout.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: >
            La reserva venció (`/problemas/reserva-vencida`), la venta ya está paga (`/problemas/venta-ya-paga`) o hay
            otro pago en curso o sin resultado (`/problemas/operacion-en-curso`). Si la compra seguía vigente pero
            perdió su instancia, antes de responder `reserva-vencida` la venta pasa a `CANCELADA` y el cupo vuelve a
            Eventos
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '504':
          description: >
            La pasarela no respondió a tiempo (`/problemas/sin-respuesta`). No se sabe si el cobro se hizo: hay que
            consultar la venta antes de reintentar.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/entradas/{entradaId}:
    get:
      tags: [ventas]
      summary: Detalle de una entrada propia
      description: Requiere rol `user`. Una entrada de otro usuario responde 404.
      parameters:
        - name: entradaId
          in: path
          required: true
          schema: { type: string, example: T-d8e62a1e }
      responses:
        '200':
          description: Entrada encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entrada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/pagos:
    post:
      tags: [pagos]
      summary: Cobrar un monto con la pasarela
      description: >
        Requiere rol `servicio`. Pasarela simulada: el token `tok_test` aprueba, `tok_rechazado` rechaza y
        `tok_sin_respuesta` no responde. Un rechazo no es un error: responde 201 con `estado` `RECHAZADO`.
        Repetir la misma `Idempotency-Key` con el mismo pedido devuelve el pago ya resuelto.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 80 }
          description: Clave por intento de cobro. Ventas manda la misma que recibió en el pago.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoCobro' }
      responses:
        '201':
          description: Pago resuelto, aprobado o rechazado
          headers:
            Location:
              schema: { type: string, example: http://localhost:8080/api/v1/pagos/P-8c21d0e4 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pago' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409':
          description: >
            La clave ya se usó con otro pedido (`/problemas/clave-reutilizada`) o ya existe un pago con esos datos
            (`/problemas/pago-duplicado`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '504': { $ref: '#/components/responses/SinRespuesta' }

    get:
      tags: [pagos]
      summary: Buscar un pago por su clave de idempotencia
      description: >
        Requiere rol `servicio`. La usa la conciliación de Ventas para saber cómo terminó un cobro que quedó sin
        resultado. Devuelve un pago y no una lista porque la clave es única.
      parameters:
        - name: claveIdempotencia
          in: query
          required: true
          schema: { type: string, maxLength: 80, example: 'V-3f9a1c2b:5d3c1f0e-8a4b-4c7d-9e2f-1a2b3c4d5e6f' }
      responses:
        '200':
          description: Pago encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pago' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404':
          description: No hay ningún pago con esa clave (`/problemas/no-encontrado`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/pagos/{pagoId}:
    get:
      tags: [pagos]
      summary: Consultar un pago
      description: Requiere rol `servicio`.
      parameters:
        - name: pagoId
          in: path
          required: true
          schema: { type: string, example: P-8c21d0e4 }
      responses:
        '200':
          description: Pago encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pago' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/reventas:
    get:
      tags: [reventas]
      summary: Publicaciones activas de un evento
      description: >
        Público, como el catálogo. Devuelve solo las publicaciones `ACTIVA` del evento. Sin `eventoId` responde 400.
      security: []
      parameters:
        - name: eventoId
          in: query
          required: true
          schema: { type: string, maxLength: 40, example: ev-1 }
      responses:
        '200':
          description: Lista de publicaciones activas (vacía si no hay)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Publicacion' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
    post:
      tags: [reventas]
      summary: Publicar una entrada propia en la reventa oficial
      description: >
        Requiere rol `user` y ser el dueño de la entrada, que tiene que estar `VALIDA`. El precio va del 50% al 110%
        de lo pagado por la entrada (`ReglasDeNegocio`). Reventa le pide a Ventas que deje la entrada `PUBLICADA`
        (operación interna `POST /v1/operaciones-de-reventa/publicaciones`). La reventa cierra 3 horas antes del
        evento.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaPublicacion' }
      responses:
        '201':
          description: Publicación creada, en estado `ACTIVA`
          headers:
            Location:
              schema: { type: string, example: http://localhost:8080/api/v1/reventas/R-3f9a1c2b }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publicacion' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404':
          description: La entrada no existe o no es del usuario (`/problemas/no-encontrado`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: >
            La entrada no está `VALIDA`: ya publicada, usada, vendida o sin emitir (`/problemas/entrada-no-disponible`),
            o faltan menos de 3 horas para el evento (`/problemas/reventa-cerrada`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422':
          description: El precio está fuera del rango permitido (`/problemas/precio-fuera-de-rango`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              example:
                type: /problemas/precio-fuera-de-rango
                title: Regla de negocio incumplida
                status: 422
                detail: El precio tiene que estar entre $13750 y $30250.
                instance: /api/v1/reventas
        '504': { $ref: '#/components/responses/SinRespuesta' }

  /v1/reventas/mias:
    get:
      tags: [reventas]
      summary: Publicaciones del usuario autenticado
      description: Requiere rol `user`. Todas las publicaciones del dueño del token, en todos los estados.
      responses:
        '200':
          description: Lista de publicaciones (vacía si no publicó nada)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Publicacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /v1/reventas/{publicacionId}:
    parameters:
      - $ref: '#/components/parameters/PublicacionId'
    delete:
      tags: [reventas]
      summary: Retirar una publicación propia
      description: >
        Requiere rol `user` y ser quien publicó. La publicación pasa a `RETIRADA` y la entrada vuelve a `VALIDA`.
        Una publicación de otro usuario responde 404.
      responses:
        '204':
          description: Publicación retirada
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La publicación ya se vendió, ya se retiró o la está comprando otra persona (`/problemas/publicacion-no-activa`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '504': { $ref: '#/components/responses/SinRespuesta' }

  /v1/reventas/{publicacionId}/compra:
    parameters:
      - $ref: '#/components/parameters/PublicacionId'
    post:
      tags: [reventas]
      summary: Comprar una entrada publicada en la reventa
      description: >
        Requiere rol `user`. Reventa cobra el precio más el cargo de servicio contra Pagos y le pide a Ventas la
        transferencia (operación interna `POST /v1/operaciones-de-reventa/transferencias`): la entrada original queda
        `VENDIDA` y el comprador recibe una entrada nueva, `VALIDA`, a nombre del titular indicado, dentro de una venta
        propia. Es idempotente por `Idempotency-Key`: repetirla devuelve lo mismo sin cobrar de nuevo. Si Pagos no
        responde (504), la publicación queda tomada: nadie más la compra ni el vendedor la retira hasta que el mismo
        comprador reintente con la misma clave o la conciliación de reventas sepa si se cobró (transfiere la entrada
        al titular indicado o libera la publicación).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompraDeReventa' }
      responses:
        '201':
          description: Compra hecha
          headers:
            Location:
              schema: { type: string, example: /api/v1/entradas/T-5b7e9a10 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompraDeReventaHecha' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '402':
          description: Pago rechazado por la pasarela (`/problemas/pago-rechazado`). La publicación sigue activa.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: >
            La publicación ya no está activa (`/problemas/publicacion-no-activa`), es del mismo usuario
            (`/problemas/compra-propia`) o faltan menos de 3 horas para el evento (`/problemas/reventa-cerrada`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '504':
          description: >
            Pagos o Ventas no respondieron a tiempo (`/problemas/sin-respuesta`). Se reintenta con la misma
            `Idempotency-Key`: no se cobra de nuevo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/validacion/escaneos:
    post:
      tags: [validacion]
      summary: Escanear el código QR de una entrada en la puerta
      description: >
        Requiere rol `staff`. Siempre responde 201: lo que se crea es el renglón del registro de la puerta, sea cual
        sea el resultado. Si la persona puede entrar lo dicen `resultado` y `puedeEntrar`, no el código HTTP.
        Con `VALIDA`, Validación le pide a Ventas que marque la entrada como `USADA` (operación interna
        `POST /v1/entradas/usos`); un segundo escaneo del mismo código da `YA_USADA` con el uso anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoEscaneo' }
      responses:
        '201':
          description: Escaneo registrado
          headers:
            Location:
              schema: { type: string, example: http://localhost:8080/api/v1/validacion/escaneos/ESC-1a2b3c4d }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoDeEscaneo' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '504':
          description: >
            Ventas no respondió (`/problemas/sin-respuesta`). El intento queda en el registro como `SIN_RESPUESTA`:
            hay que escanear de nuevo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
    get:
      tags: [validacion]
      summary: Registro de la puerta de un evento
      description: >
        Requiere rol `staff` u `organizer`. Del escaneo más nuevo al más viejo. El código no viaja completo: solo
        sus últimos caracteres (`codigoParcial`).
      parameters:
        - name: eventoId
          in: query
          required: true
          schema: { type: string, maxLength: 40, example: ev-1 }
      responses:
        '200':
          description: Registro de escaneos (vacío si no hubo ninguno)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Escaneo' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /v1/validacion/escaneos/{escaneoId}:
    get:
      tags: [validacion]
      summary: Un renglón del registro de la puerta
      description: Requiere rol `staff` u `organizer`.
      parameters:
        - name: escaneoId
          in: path
          required: true
          schema: { type: string, example: ESC-1a2b3c4d }
      responses:
        '200':
          description: Escaneo encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Escaneo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/facturas/{ventaId}:
    parameters:
      - $ref: '#/components/parameters/VentaId'
    get:
      tags: [facturas]
      summary: Factura de una compra
      description: >
        Requiere rol `user` (solo la factura de una compra propia) o `servicio` (cualquiera). Las facturas no se
        piden por HTTP: Facturación consume el tópico `compraConfirmada` y le pide el CAE a ARCA (simulado) por SOAP
        (`/legado/arca?wsdl`). Por eso la factura aparece unos segundos después del pago. Una venta sin factura
        todavía, inexistente o de otro comprador responde 404, igual en los tres casos.
      responses:
        '200':
          description: Factura emitida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Factura' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/entradas/usos:
    post:
      tags: [interno]
      summary: Marcar una entrada como usada en la puerta
      description: >
        Uso interno: requiere rol `servicio` y la llama solo Validación. Responde 200 (no crea un recurso, cambia el
        estado de una entrada que ya existía) con la entrada ya `USADA`. Repetirlo no la usa dos veces.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoEscaneo' }
      responses:
        '200':
          description: Entrada usada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entrada' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: >
            La entrada ya se usó (`/problemas/entrada-ya-usada`), es de otro evento
            (`/problemas/entrada-de-otro-evento`) o no sirve para entrar: publicada, vendida o anulada
            (`/problemas/entrada-no-habilitada`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/operaciones-de-reventa/entradas/{entradaId}:
    get:
      tags: [interno]
      summary: Consultar una entrada para la reventa
      description: Uso interno, rol `servicio` (lo llama Reventa). Devuelve la entrada solo si es de ese vendedor.
      parameters:
        - name: entradaId
          in: path
          required: true
          schema: { type: string, example: T-9c41d07e }
        - name: vendedorId
          in: query
          required: true
          schema: { type: string, example: user-titular }
      responses:
        '200':
          description: Entrada encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntradaEnReventa' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/operaciones-de-reventa/publicaciones:
    post:
      tags: [interno]
      summary: Dejar una entrada PUBLICADA
      description: Uso interno, rol `servicio` (lo llama Reventa al publicar).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoDeVendedor' }
      responses:
        '200':
          description: Entrada publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntradaEnReventa' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La entrada no está `VALIDA` (`/problemas/entrada-no-disponible`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/operaciones-de-reventa/retiros:
    post:
      tags: [interno]
      summary: Devolver a VALIDA una entrada publicada
      description: Uso interno, rol `servicio` (lo llama Reventa al retirar una publicación).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoDeVendedor' }
      responses:
        '200':
          description: Entrada de nuevo VALIDA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntradaEnReventa' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La entrada no está `PUBLICADA` (`/problemas/entrada-no-publicada`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/operaciones-de-reventa/transferencias:
    post:
      tags: [interno]
      summary: Transferir una entrada vendida en la reventa
      description: >
        Uso interno, rol `servicio` (lo llama Reventa después de cobrar). La entrada original queda `VENDIDA` y nace
        la venta del comprador con su entrada nueva, `VALIDA` y con código QR. Repetirlo devuelve lo mismo, también
        con 201.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Transferencia' }
      responses:
        '201':
          description: Transferencia hecha
          headers:
            Location:
              schema: { type: string, example: http://localhost:8080/api/v1/ventas/V-7a1b2c3d }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferenciaHecha' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La entrada no está `PUBLICADA` (`/problemas/entrada-no-publicada`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token RS256 emitido por `POST /usuarios/login` o `POST /usuarios/verificacion` (ServicioDeUsuarios); el rol
        viaja en el claim `groups` (`user`, `organizer`, `staff`). Las llamadas entre servicios usan un token de rol
        `servicio` emitido por `POST /usuarios/servicios/token`.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: UUID por intento lógico. Repetir la clave devuelve la misma respuesta sin duplicar la operación.
    PublicacionId:
      name: publicacionId
      in: path
      required: true
      schema: { type: string, example: R-3f9a1c2b }
    VentaId:
      name: ventaId
      in: path
      required: true
      schema: { type: string, example: V-3f9a1c2b }

  responses:
    DatosInvalidos:
      description: Cuerpo ausente o mal formado, o campos inválidos (`/problemas/datos-invalidos`, con `errores` por campo)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: /problemas/datos-invalidos
            title: Datos inválidos
            status: 400
            detail: Hay datos inválidos.
            instance: /api/usuarios/registro
            errores:
              email: Ingresá un email válido.
    NoAutenticado:
      description: Falta el token o es inválido (`/problemas/no-autenticado`)
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    SinPermiso:
      description: El rol del token no puede hacer esta operación (`/problemas/sin-permiso`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoEncontrado:
      description: El recurso no existe o no pertenece al usuario (`/problemas/no-encontrado`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    SinRespuesta:
      description: Un servicio del que depende la operación no respondió a tiempo (`/problemas/sin-respuesta`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    ErrorInesperado:
      description: >
        Error no previsto (`/problemas/error-inesperado`). No trae detalles internos: trae `idError`, el id con el
        que quedó la traza en el log del servidor, para buscarla cuando alguien reporta el error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: /problemas/error-inesperado
            title: Error inesperado
            status: 500
            detail: Ocurrió un error inesperado.
            instance: /api/v1/ventas
            idError: 3b9f2c1e-7a4d-4e8b-9c2f-1d6a5e0b7c43

  schemas:
    Problema:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: /problemas/cupo-agotado }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errores:
          type: object
          additionalProperties: { type: string }
          description: Errores de validación por campo (extensión propia)
        idError:
          type: string
          format: uuid
          description: Solo en los 500. Id del error, el mismo que queda en el log junto con la traza (extensión propia)
      additionalProperties: true

    Registro:
      type: object
      required: [nombre, apellido, dni, fechaNacimiento, email, password]
      properties:
        nombre: { type: string, example: Ana }
        apellido: { type: string, example: Gómez }
        dni: { type: string, pattern: '^\d{7,8}$', example: '30123456' }
        fechaNacimiento: { type: string, format: date, description: Mayor de 16 años, example: '1995-04-20' }
        email: { type: string, format: email, maxLength: 200 }
        telefono: { type: string, maxLength: 30 }
        password: { type: string, minLength: 8, description: 'Al menos 8 caracteres, con letras y números' }

    RegistroPendiente:
      type: object
      properties:
        email: { type: string }
        mensaje: { type: string }

    Verificacion:
      type: object
      required: [email, codigo]
      properties:
        email: { type: string }
        codigo: { type: string, pattern: '^\d{6}$', example: '123456' }

    Reenvio:
      type: object
      required: [email]
      properties:
        email: { type: string }

    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: titular@palco.test }
        password: { type: string }

    Sesion:
      type: object
      properties:
        token: { type: string, description: JWT RS256 }
        expiraEnSegundos: { type: integer, format: int64, example: 28800 }
        usuario: { $ref: '#/components/schemas/Usuario' }

    Usuario:
      type: object
      properties:
        id: { type: string, example: user-titular }
        nombre: { type: string }
        apellido: { type: string }
        dni: { type: string }
        email: { type: string }
        rol: { type: string, enum: [user, organizer, staff] }
        identidadVerificada: { type: boolean }

    Secreto:
      type: object
      required: [secreto]
      properties:
        secreto: { type: string }

    TokenDeServicio:
      type: object
      properties:
        token: { type: string }
        expiraEnSegundos: { type: integer, format: int64, example: 300 }

    Sector:
      type: object
      properties:
        id: { type: string, example: sec-1-1 }
        nombre: { type: string, example: Platea A }
        precio: { type: integer, format: int64, example: 27500 }
        cupo: { type: integer }
        vendidas: { type: integer }

    Evento:
      type: object
      properties:
        id: { type: string, example: ev-1 }
        slug: { type: string }
        titulo: { type: string }
        categoria: { type: string, example: Música }
        venue: { type: string }
        fechaISO: { type: string, description: 'Fecha y hora local del evento, sin zona', example: '2026-12-26T17:00:00' }
        descripcion: { type: string }
        destacado: { type: boolean }
        imagenUrl: { type: [string, 'null'] }
        sectores:
          type: array
          items: { $ref: '#/components/schemas/Sector' }

    NuevoSector:
      type: object
      required: [nombre, precio, cupo]
      properties:
        nombre: { type: string, maxLength: 120 }
        precio: { type: integer, format: int64, minimum: 1 }
        cupo: { type: integer, minimum: 1 }

    NuevoEvento:
      type: object
      required: [titulo, categoria, venue, fechaISO, descripcion, sectores]
      properties:
        titulo: { type: string, maxLength: 200 }
        categoria: { type: string, description: Una de las categorías del catálogo, example: Música }
        venue: { type: string, maxLength: 200 }
        fechaISO: { type: string, description: 'Fecha y hora local, sin zona', example: '2026-12-26T21:00:00' }
        descripcion: { type: string, maxLength: 2000 }
        imagenUrl: { type: string, maxLength: 1000 }
        sectores:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/NuevoSector' }

    CambioCupo:
      type: object
      required: [cantidad]
      properties:
        cantidad: { type: integer, description: 'Positiva reserva, negativa libera', example: 2 }
        clave:
          type: string
          maxLength: 120
          description: >
            Solo para liberar (cantidad negativa). Hace la devolución segura de repetir: Eventos no aplica dos veces la
            misma clave. Ventas manda una por venta y sector.
          example: 'devolucion:V-3f9a1c2b:sec-1-1'

    Titular:
      type: object
      required: [nombre, dni]
      properties:
        nombre: { type: string, maxLength: 200, example: Ana Gómez }
        dni: { type: string, pattern: '^\d{7,8}$', example: '30123456' }

    ItemVenta:
      type: object
      required: [sectorId, cantidad]
      properties:
        sectorId: { type: string, maxLength: 40, example: sec-1-1 }
        cantidad: { type: integer, minimum: 1, description: El total de la compra no puede pasar de 6 entradas }
        sector: { type: string, readOnly: true, example: Platea A }
        precioUnitario: { type: integer, format: int64, readOnly: true, example: 27500 }

    NuevaVenta:
      type: object
      required: [eventoId, items, titulares]
      properties:
        eventoId: { type: string, maxLength: 40, example: ev-1 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ItemVenta' }
        titulares:
          type: array
          minItems: 1
          description: Un titular nominativo por entrada
          items: { $ref: '#/components/schemas/Titular' }

    NuevoPago:
      type: object
      required: [medioDePago, token]
      properties:
        medioDePago: { type: string, maxLength: 40, example: tarjeta }
        token:
          type: string
          maxLength: 200
          description: Token de tarjeta generado por el SDK de la pasarela
          example: tok_test

    Enlaces:
      type: object
      description: Enlaces HATEOAS a las operaciones que el recurso admite en su estado actual
      additionalProperties:
        type: object
        properties:
          href: { type: string }
          method: { type: string }

    EntradaDeVenta:
      type: object
      properties:
        id: { type: string, example: T-d8e62a1e }
        sectorId: { type: string }
        sector: { type: string }
        titular: { $ref: '#/components/schemas/Titular' }
        precioPagado: { type: integer, format: int64, description: Precio del sector sin el cargo de servicio; es la base del tope de reventa }
        estado:
          type: string
          enum: [PENDIENTE_EMISION, VALIDA, USADA, PUBLICADA, VENDIDA, ANULADA]
        codigoQr: { type: [string, 'null'], description: Vacío hasta que la entrada se emite }
        _links: { $ref: '#/components/schemas/Enlaces' }

    Entrada:
      allOf:
        - $ref: '#/components/schemas/EntradaDeVenta'
        - type: object
          properties:
            ventaId: { type: string }
            eventoId: { type: string }
            emitida: { type: [string, 'null'], format: date-time }

    Venta:
      type: object
      properties:
        id: { type: string, example: V-3f9a1c2b }
        estado:
          type: string
          enum: [EN_CHECKOUT, CONFIRMADA, EMITIDA, CANCELADA, VENCIDA]
        facturaEstado:
          type: string
          enum: [NO_APLICA, AUTORIZADA, PENDIENTE, RECHAZADA]
        eventoId: { type: string, example: ev-1 }
        items:
          type: array
          items: { $ref: '#/components/schemas/ItemVenta' }
        subtotal: { type: integer, format: int64, example: 55000 }
        cargoServicio: { type: integer, format: int64, description: 10% del subtotal, example: 5500 }
        montoTotal: { type: integer, format: int64, example: 60500 }
        creada: { type: string, format: date-time }
        venceReserva: { type: string, format: date-time }
        pagoId: { type: [string, 'null'], example: P-8c21d0e4 }
        entradas:
          type: array
          description: Vacía hasta que el pago se aprueba
          items: { $ref: '#/components/schemas/EntradaDeVenta' }
        _links: { $ref: '#/components/schemas/Enlaces' }

    NuevoCobro:
      type: object
      required: [ventaId, monto, medioDePago, token]
      properties:
        ventaId: { type: string, maxLength: 40, example: V-3f9a1c2b }
        monto: { type: integer, format: int64, minimum: 1, example: 60500 }
        medioDePago: { type: string, maxLength: 40, example: tarjeta }
        token: { type: string, maxLength: 200, example: tok_test }

    Pago:
      type: object
      properties:
        pagoId: { type: string, example: P-8c21d0e4 }
        ventaId: { type: string }
        monto: { type: integer, format: int64 }
        estado: { type: string, enum: [APROBADO, RECHAZADO] }
        motivo: { type: [string, 'null'], example: fondos_insuficientes }
        idExterno: { type: [string, 'null'] }

    NuevaPublicacion:
      type: object
      required: [entradaId, precio]
      properties:
        entradaId: { type: string, maxLength: 40, example: T-9c41d07e }
        precio:
          type: integer
          format: int64
          description: Lo que paga el comprador por la entrada, sin el cargo de servicio. Del 50% al 110% de lo pagado
          example: 29000

    Publicacion:
      type: object
      properties:
        id: { type: string, example: R-3f9a1c2b }
        entradaId: { type: string, example: T-9c41d07e }
        eventoId: { type: string, example: ev-1 }
        sectorId: { type: string, example: sec-1-4 }
        sector: { type: string, example: Platea B }
        precio: { type: integer, format: int64, description: Sin el cargo de servicio, example: 29000 }
        precioMaximo: { type: integer, format: int64, description: Tope de esa entrada (lo pagado más el 10%), example: 30250 }
        estado: { type: string, enum: [ACTIVA, VENDIDA, RETIRADA] }
        publicada: { type: string, format: date-time }

    CompraDeReventa:
      type: object
      required: [titular, medioDePago, token]
      properties:
        titular: { $ref: '#/components/schemas/Titular' }
        medioDePago: { type: string, maxLength: 40, example: tarjeta }
        token: { type: string, maxLength: 200, description: Token de la pasarela; no se guarda, example: tok_test }

    EntradaTransferida:
      type: object
      properties:
        id: { type: string, example: T-5b7e9a10 }
        codigoQr: { type: string }
        titular: { $ref: '#/components/schemas/Titular' }
        eventoId: { type: string, example: ev-1 }
        sectorId: { type: string, example: sec-1-4 }
        precioPagado: { type: integer, format: int64, description: El precio de la publicación, example: 29000 }

    CompraDeReventaHecha:
      type: object
      properties:
        publicacion: { $ref: '#/components/schemas/Publicacion' }
        entrada: { $ref: '#/components/schemas/EntradaTransferida' }
        ventaId: { type: string, description: La venta del comprador en Ventas, example: V-7a1b2c3d }

    NuevoEscaneo:
      type: object
      required: [codigoQr, eventoId]
      properties:
        codigoQr: { type: string, maxLength: 200 }
        eventoId: { type: string, maxLength: 40, description: El evento que controla la puerta, example: ev-1 }

    ResultadoDeEscaneo:
      type: object
      properties:
        id: { type: string, example: ESC-1a2b3c4d }
        resultado:
          type: string
          enum: [VALIDA, YA_USADA, INEXISTENTE, OTRO_EVENTO, NO_HABILITADA]
        puedeEntrar: { type: boolean, description: true solo con VALIDA }
        mensaje: { type: string, description: Texto para el personal de puerta }
        eventoId: { type: string, example: ev-1 }
        entrada:
          description: Solo con VALIDA
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: string, example: T-d8e62a1e }
                sectorId: { type: string }
                sector: { type: string }
                titular: { $ref: '#/components/schemas/Titular' }
        usoAnterior:
          description: Solo con YA_USADA, si este servicio registró el escaneo anterior
          oneOf:
            - type: 'null'
            - type: object
              properties:
                escaneoId: { type: string }
                resultado: { type: string, enum: [VALIDA, SIN_RESPUESTA] }
                escaneadoPor: { type: string }
                escaneado: { type: string, format: date-time }
        escaneadoPor: { type: string, example: user-puerta }
        escaneado: { type: string, format: date-time }

    Escaneo:
      type: object
      properties:
        id: { type: string, example: ESC-1a2b3c4d }
        eventoId: { type: string, example: ev-1 }
        codigoParcial: { type: string, description: Los últimos caracteres del código }
        resultado:
          type: string
          enum: [VALIDA, YA_USADA, INEXISTENTE, OTRO_EVENTO, NO_HABILITADA, SIN_RESPUESTA]
        entradaId: { type: [string, 'null'] }
        escaneadoPor: { type: string }
        escaneado: { type: string, format: date-time }

    Factura:
      type: object
      properties:
        ventaId: { type: string, example: V-3f9a1c2b }
        compradorId: { type: string, example: user-titular }
        eventoId: { type: string, example: ev-1 }
        tipoComprobante: { type: integer, description: 'Código de ARCA: 6 es factura B', example: 6 }
        puntoDeVenta: { type: integer, example: 1 }
        numero: { type: integer, format: int64, example: 1 }
        comprobante: { type: string, description: Punto de venta y número como se imprimen, example: 00001-00000001 }
        cae: { type: string, pattern: '^\d{14}$', description: Código de autorización electrónico (simulado) }
        vencimientoCae: { type: string, format: date }
        importe: { type: integer, format: int64, description: El total cobrado, example: 60500 }
        fecha: { type: string, format: date, description: 'Fecha del comprobante, en hora argentina' }
        emitida: { type: string, format: date-time }

    EntradaEnReventa:
      type: object
      properties:
        entradaId: { type: string }
        ventaId: { type: string }
        eventoId: { type: string }
        sectorId: { type: string }
        sector: { type: string }
        precioPagado: { type: integer, format: int64 }
        estado: { type: string, enum: [PENDIENTE_EMISION, VALIDA, USADA, PUBLICADA, VENDIDA, ANULADA] }

    PedidoDeVendedor:
      type: object
      required: [entradaId, vendedorId]
      properties:
        entradaId: { type: string, maxLength: 40 }
        vendedorId: { type: string, maxLength: 40 }

    Transferencia:
      type: object
      required: [publicacionId, entradaId, vendedorId, compradorId, titular, precio, pagoId]
      properties:
        publicacionId: { type: string, maxLength: 40 }
        entradaId: { type: string, maxLength: 40 }
        vendedorId: { type: string, maxLength: 40 }
        compradorId: { type: string, maxLength: 40 }
        titular: { $ref: '#/components/schemas/Titular' }
        precio: { type: integer, format: int64, minimum: 1, description: Pasa a ser el precioPagado de la entrada nueva }
        pagoId: { type: string, maxLength: 40 }

    TransferenciaHecha:
      type: object
      properties:
        ventaId: { type: string }
        entrada: { $ref: '#/components/schemas/Entrada' }
