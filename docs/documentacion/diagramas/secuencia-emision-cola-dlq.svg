<text x="103.5" y="1000.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f2937" text-anchor="start">Con jboss-cli.bat el filtro va en un archivo (--file), porque --command pierde las comillas. move-messages con filtro todavía no se</text>
<text x="103.5" y="1018.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f2937" text-anchor="start">ejecutó; sin filtro se usa en el escenario 12.</text>
<line x1="24" y1="1065.5" x2="64" y2="1065.5" stroke="#1f2937" stroke-width="1.5" marker-end="url(#lleno)"/>
