<text x="406.2" y="1070.5" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4b5563" text-anchor="start">Mensaje asincrónico (JMS)</text>
<text x="24.0" y="1093.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="start">Fuente: EmisionDeEntradasMDB, EntradaRepositoryJpa, VentaRepositoryJpa, PublicadorPagoConfirmadoJms, DestinosJms y configurar.cli (address-setting=#:</text>
<text x="24.0" y="1109.8" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="start">max-delivery-attempts 5, redelivery-delay 2000). Evidencia: escenario 12.</text>
