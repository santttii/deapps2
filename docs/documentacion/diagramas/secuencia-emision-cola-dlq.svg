<text x="330.0" y="460.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f2937" text-anchor="start">La venta queda CONFIRMADA con</text>
<text x="330.0" y="478.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f2937" text-anchor="start">entradas PENDIENTE_EMISION; nada</text>
<text x="330.0" y="496.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f2937" text-anchor="start">la reintenta sola. Los demás mensajes</text>
<text x="330.0" y="514.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f2937" text-anchor="start">siguen pasando (escenario 12).</text>
