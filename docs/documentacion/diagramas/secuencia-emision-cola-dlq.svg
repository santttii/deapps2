<text x="426.2" y="794.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2b5797" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">7. el mensaje vuelve a la cola</text>
<line x1="716.0" y1="805.5" x2="136.5" y2="805.5" stroke="#2b5797" stroke-width="1.8" marker-end="url(#async)"/>
<text x="243.0" y="834.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2b5797" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">8. se entrega otra vez</text>
<line x1="136.5" y1="845.5" x2="349.4" y2="845.5" stroke="#2b5797" stroke-width="1.8" marker-end="url(#async)"/>
<text x="450.0" y="874.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">9. emite: los mismos UPDATE condicionales; es</text>
<text x="450.0" y="894.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">seguro porque la emisión es idempotente</text>
<line x1="355.4" y1="905.5" x2="544.6" y2="905.5" stroke="#1f2937" stroke-width="1.5" marker-end="url(#lleno)"/>
<text x="719.0" y="934.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">10. comprueba: venta EMITIDA y entradas</text>
<text x="719.0" y="954.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">VALIDA</text>
<line x1="887.3" y1="965.5" x2="550.6" y2="965.5" stroke="#1f2937" stroke-width="1.5" marker-end="url(#lleno)"/>
