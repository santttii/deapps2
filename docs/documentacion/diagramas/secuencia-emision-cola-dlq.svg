<text x="804.6" y="598.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">4. list-messages y count-messages con el filtro</text>
<text x="804.6" y="618.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">_AMQ_ORIG_QUEUE =</text>
<text x="804.6" y="638.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">'jms.queue.cola.emision-entradas'</text>
<line x1="887.3" y1="649.5" x2="722.0" y2="649.5" stroke="#1f2937" stroke-width="1.5" marker-end="url(#lleno)"/>
<text x="846.3" y="678.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">5. Ve la causa en server.log (la línea</text>
<text x="846.3" y="698.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">AMQ222149 y las 5 fallas) y la corrige</text>
<polyline points="890.3199999999999,669.5 856.3199999999999,669.5 856.3199999999999,705.5 886.3199999999999,705.5" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#lleno)"/>
<text x="804.6" y="734.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">6. move-messages con el mismo filtro hacia</text>
<text x="804.6" y="754.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">cola.emision-entradas</text>
