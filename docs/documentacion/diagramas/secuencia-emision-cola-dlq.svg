<text x="243.0" y="264.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2b5797" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1. entrega o reentrega el mismo mensaje</text>
<line x1="136.5" y1="275.5" x2="349.4" y2="275.5" stroke="#2b5797" stroke-width="1.8" marker-end="url(#async)"/>
<text x="396.4" y="304.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2. falla (mensaje inválido u otra excepción): la</text>
<text x="396.4" y="324.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">transacción se deshace entera</text>
