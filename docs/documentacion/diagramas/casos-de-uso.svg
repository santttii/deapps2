<text x="544" y="980" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#4b5563" text-anchor="start">Implementado, sin probar en el servidor</text>
<text x="24" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="start">* Sin pantalla en el frontend: se usa por la API.</text>
<text x="24" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="start">Usuario registrado (en cursiva) es un actor abstracto: lo que puede hacer cualquiera de las tres cuentas. Flecha punteada «extend»: extensión opcional del caso al que apunta.</text>
<text x="24" y="1055" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="start">La compra pide la sesión iniciada; el aviso, la auditoría y la factura salen solos al confirmarse el pago, también en la reventa.</text>
