# nginx del contenedor web: HTTP redirige a HTTPS, sirve el frontend y pasa /api y /legado al backend.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/palco.crt;
    ssl_certificate_key /etc/nginx/tls/palco.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;

    # Cabeceras de seguridad, también en los errores ("always") y en lo que viene del backend.
    # style-src con 'unsafe-inline': framer-motion anima con atributos style. Las fuentes son de Google Fonts.
    # img-src https: las fotos de los eventos pueden venir del almacenamiento de Supabase.
    # img-src blob: la vista previa de la foto antes de subirla es una URL local del navegador.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Pagos sin respuesta espera su timeout antes de contestar 504: que nginx no corte antes.
        proxy_read_timeout 60s;
        # La foto de un evento puede pesar hasta 2 MB (TiposDeImagen.MAXIMO_BYTES); nginx corta en 1 MB
        # si no se dice otra cosa. Un poco más, para que el límite y su mensaje los ponga el backend.
        client_max_body_size 3m;
        # Con el backend caído o lento, el 502, 503 o 504 lo arma nginx: sale en Problem Details
        # (RFC 9457), como los errores del backend, y no en HTML. Son solo los que genera nginx: los que
        # manda el backend (el 504 de Pagos sin respuesta, por ejemplo) pasan tal cual, con su detalle,
        # porque proxy_intercept_errors queda apagado.
        error_page 502 @api-502;
        error_page 503 @api-503;
        error_page 504 @api-504;
    }

    # Sin error_page: es el ARCA simulado, un servicio SOAP que representa a un sistema externo. Quien
    # le habla espera un SOAP Fault y no Problem Details, que es el formato de la API de Palco.
    location /legado/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Los errores de /api que arma nginx. Los type y title siguen a los del backend (Problema.java):
    # el 504 es /problemas/sin-respuesta, el mismo que usa el backend cuando otro servicio no le contesta.
    # Sin add_header acá, así se heredan las cabeceras de seguridad del server ("always" las pone también
    # en los errores). "types {}" vacío hace que el Content-Type sea siempre el de default_type, aunque la
    # ruta del pedido termine en .jpg. No llevan instance: nginx no puede escapar la ruta para JSON.
    location @api-502 {
        types { }
        default_type application/problem+json;
        return 502 '{"type":"/problemas/servidor-no-disponible","title":"Servidor no disponible","status":502,"detail":"No pudimos conectar con el servidor. Probá de nuevo en un momento."}';
    }

    location @api-503 {
        types { }
        default_type application/problem+json;
        return 503 '{"type":"/problemas/servidor-no-disponible","title":"Servidor no disponible","status":503,"detail":"No pudimos conectar con el servidor. Probá de nuevo en un momento."}';
    }

    location @api-504 {
        types { }
        default_type application/problem+json;
        return 504 '{"type":"/problemas/sin-respuesta","title":"Sin respuesta","status":504,"detail":"El servidor no respondió a tiempo. Probá de nuevo en un momento."}';
    }

    # SPA: toda ruta que no es un archivo la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header en un location reemplaza todos los del server: se repiten las seis de seguridad,
        # iguales. Si se agrega o se cambia una arriba, va también acá.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }
}
