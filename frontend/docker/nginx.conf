# nginx del contenedor web: HTTP redirige a HTTPS, sirve el frontend y pasa /api al backend.

# Log de accesos sin emails (criterio SEC-D03). El de la imagen escribe la ruta y la consulta de cada pedido, y dos
# operaciones llevan ahí el email de una cuenta: PUT y DELETE /api/v1/validacion/puertas/{eventoId}/{email} (el
# panel del organizador, con el email codificado: %40 en lugar de @) y GET /api/usuarios/cuentas?email= (interna,
# del rol servicio; Validación la llama directo al backend, pero alguien puede pedirla por acá). En el log quedan
# con <email> en su lugar. Después, si en lo que queda hay todavía un @ o un %40 (otra ruta, o un segundo email en
# la consulta), no se escribe la ruta. La API no cambia: solo lo que se escribe en el log.
map $request_uri $ruta_enmascarada {
    "~^(?<antes>/api/v1/validacion/puertas/[^/?]+/)[^/?]+"                 "${antes}<email>";
    "~^(?<ruta>[^?]*)\?(?<antes>(?:[^&]*&)*)email=[^&]*(?<despues>.*)$"   "${ruta}?${antes}email=<email>${despues}";
    default                                                                $request_uri;
}

map $ruta_enmascarada $ruta_para_el_log {
    "~(?:@|%40)"    "<ruta con un email: no se escribe>";
    default         $ruta_enmascarada;
}

# El Referer es la página de la app desde la que salió el pedido; ninguna lleva un email, pero por las dudas recibe
# el mismo control. Sin Referer queda "-", como en el formato de la imagen.
map $http_referer $referer_para_el_log {
    ""              "-";
    "~(?:@|%40)"    "<referer con un email: no se escribe>";
    default         $http_referer;
}

# El formato "main" de la imagen, con la ruta y el Referer de arriba en lugar de $request y $http_referer.
log_format palco '$remote_addr - $remote_user [$time_local] "$request_method $ruta_para_el_log $server_protocol" '
                 '$status $body_bytes_sent "$referer_para_el_log" "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log palco;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/palco.crt;
    ssl_certificate_key /etc/nginx/tls/palco.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    access_log /var/log/nginx/access.log palco;

    # Cabeceras de seguridad, también en los errores ("always") y en lo que viene del backend.
    # style-src con 'unsafe-inline': framer-motion anima con atributos style. Las fuentes las sirve el propio
    # sitio (/fuentes): font-src no necesita otro origen.
    # img-src https: las fotos de los eventos pueden venir del almacenamiento de Supabase.
    # img-src blob: la vista previa de la foto antes de subirla es una URL local del navegador.
    # Cross-Origin-Opener-Policy same-origin: una página de otro sitio que abra Palco en otra ventana no queda con
    # una referencia a ella (ni Palco a la suya). La app no abre ventanas de otros sitios.
    # Cross-Origin-Resource-Policy same-origin: otro sitio no puede cargar los recursos de Palco (la página, los
    # archivos, las fotos ni las respuestas de la API) con un <img> o un <script>; la app los pide desde su origen.
    # Cross-Origin-Embedder-Policy no va: con require-corp el navegador bloquearía las fotos de los eventos que
    # vienen de otro origen (por qué, en .zap/reglas.tsv).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Pagos sin respuesta espera su timeout antes de contestar 504: que nginx no corte antes.
        proxy_read_timeout 60s;
        # La foto de un evento puede pesar hasta 2 MB (TiposDeImagen.MAXIMO_BYTES); nginx corta en 1 MB
        # si no se dice otra cosa. Un poco más, para que el límite y su mensaje los ponga el backend.
        client_max_body_size 3m;
        # Con el backend caído o lento, el 502, 503 o 504 lo arma nginx: sale en Problem Details
        # (RFC 9457), como los errores del backend, y no en HTML. Son solo los que genera nginx: los que
        # manda el backend (el 504 de Pagos sin respuesta, por ejemplo) pasan tal cual, con su detalle,
        # porque proxy_intercept_errors queda apagado.
        error_page 502 @api-502;
        error_page 503 @api-503;
        error_page 504 @api-504;
    }

    # El ARCA simulado (/legado/arca) representa a un sistema externo y no pide autenticación: no se publica.
    # Facturación lo llama por la red interna (PALCO_URL_INTERNA, http://localhost:8080 dentro del backend) y las
    # pruebas (scripts/pruebas/seguridad.mjs, bloque D) por el puerto del backend, que el compose publica solo
    # en 127.0.0.1. Sin este bloque, la ruta caería en el de la app y respondería la página con 200.
    location /legado/ {
        return 404;
    }

    # Los errores de /api que arma nginx. Los type y title siguen a los del backend (Problema.java):
    # el 504 es /problemas/sin-respuesta, el mismo que usa el backend cuando otro servicio no le contesta.
    # Sin add_header acá, así se heredan las cabeceras de seguridad del server ("always" las pone también
    # en los errores). "types {}" vacío hace que el Content-Type sea siempre el de default_type, aunque la
    # ruta del pedido termine en .jpg. No llevan instance: nginx no puede escapar la ruta para JSON.
    location @api-502 {
        types { }
        default_type application/problem+json;
        return 502 '{"type":"/problemas/servidor-no-disponible","title":"Servidor no disponible","status":502,"detail":"No pudimos conectar con el servidor. Probá de nuevo en un momento."}';
    }

    location @api-503 {
        types { }
        default_type application/problem+json;
        return 503 '{"type":"/problemas/servidor-no-disponible","title":"Servidor no disponible","status":503,"detail":"No pudimos conectar con el servidor. Probá de nuevo en un momento."}';
    }

    location @api-504 {
        types { }
        default_type application/problem+json;
        return 504 '{"type":"/problemas/sin-respuesta","title":"Sin respuesta","status":504,"detail":"El servidor no respondió a tiempo. Probá de nuevo en un momento."}';
    }

    # SPA: toda ruta que no es un archivo la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header en un location reemplaza todos los del server: se repiten las ocho de seguridad,
        # iguales. Si se agrega o se cambia una arriba, va también acá.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }
}
