<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El tema guardado se pone antes del primer pintado (ver public/tema-inicial.js). -->
    <script src="/tema-inicial.js"></script>
    <meta
      name="description"
      content="Palco: venta de entradas nominativas con reventa oficial y tope de precio de +10%. Proyecto académico con eventos ficticios."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Las fuentes las sirve el propio sitio (ver public/fuentes/fuentes.css). Se piden desde acá
         y no con @import en el CSS: así el navegador las descubre al leer el HTML, sin esperar a
         bajar la hoja de estilos de la app. La de los textos se precarga porque aparece en toda
         pantalla; una fuente precargada necesita crossorigin aunque sea del mismo sitio. -->
    <link rel="preload" href="/fuentes/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fuentes/fuentes.css" />
    <title>Palco</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
