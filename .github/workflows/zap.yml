# Escaneo de seguridad de Palco con OWASP ZAP, contra el sistema levantado con docker compose. Corre con los
# mismos disparadores que ci.yml, en un workflow aparte: ataca al sistema (el escaneo activo crea datos y
# manda entradas inválidas), así que usa su propio compose, y se puede volver a correr solo.
#
#   baseline   pasivo, contra la app por nginx (https): cabeceras, CSP, cookies y datos expuestos
#   api        pasivo y activo, contra la API por nginx: las operaciones de docs/api/openapi.yaml con el
#              token de titular@palco.test (cuenta de prueba) y la política API-Minimal de ZAP, con un tope
#              de 7 minutos para el escaneo activo
#
# Los dos los corre scripts/qa/zap.sh, que también se puede correr a mano contra un compose levantado.
# Criterio: ninguna alerta High y cada Medium justificada en .zap/reglas.tsv. Lo aplica
# scripts/qa/zap-resumen.mjs: si no se cumple, el job falla. El resumen queda en el de la corrida y los
# reportes HTML, JSON y Markdown de ZAP, como artifact.

name: ZAP

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap:
    name: OWASP ZAP (baseline y API autenticada)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # El log del servidor queda en ./logs, para revisar que el escaneo no dejó tokens escritos.
      PALCO_DIR_LOGS: ./logs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Secretos de esta corrida
        # Nunca están en el repo: se generan acá y se le pasan al compose.
        run: |
          secreto=$(openssl rand -hex 32)
          echo "::add-mask::$secreto"
          echo "PALCO_SECRETO_SERVICIOS=$secreto" >> "$GITHUB_ENV"
          mkdir -p logs && chmod 777 logs
      - name: Imágenes del sistema (con reintentos si falla la red)
        # Las mismas descargas y los mismos reintentos que en la integración de ci.yml (ahí está el porqué).
        run: |
          for intento in 1 2 3 4; do
            docker compose pull --ignore-buildable --quiet && docker compose build && exit 0
            echo "Falló la descarga o el armado de las imágenes (intento $intento de 4)"
            [ "$intento" -lt 4 ] && sleep $((intento * 30))
          done
          exit 1
      - name: docker compose up (un comando, todo el sistema)
        run: |
          inicio=$(date +%s)
          docker compose up --build --detach --wait --wait-timeout 900
          echo "Levantado en $(( $(date +%s) - inicio )) segundos" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: OWASP ZAP (scripts/qa/zap.sh)
        # Baja la imagen de ZAP (fijada en el guion), corre los dos escaneos y aplica el criterio.
        timeout-minutes: 25
        run: bash scripts/qa/zap.sh
      - name: Resumen de ZAP
        if: always()
        run: |
          if [ -f logs/zap/resumen.md ]; then
            cat logs/zap/resumen.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ZAP no dejó resumen: ver el log del paso anterior.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Control de logs (sin tokens después del escaneo)
        # El escaneo de la API manda el token en cada pedido y prueba entradas inválidas en todas las
        # operaciones: ninguna respuesta de error tiene que haberlo escrito en el log.
        if: always()
        run: |
          if grep -nE 'Bearer [A-Za-z0-9._-]{20,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ' logs/server.log; then
            echo "El log del servidor tiene tokens"; exit 1
          fi
      - name: Estado de los contenedores
        if: always()
        run: docker compose ps && docker compose logs --no-color > compose-zap.log
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reporte-zap
          path: |
            logs/zap/
            compose-zap.log
          if-no-files-found: ignore
      - name: Bajar todo
        if: always()
        run: docker compose down -v
