# Pipeline de Palco. Corre en cada push a master, en cada pull request y en los tags v*.
# Los jobs corren en paralelo; si cualquiera falla, la corrida queda en rojo.
#
#   secretos     gitleaks sobre todo el historial
#   backend      mvn verify: tests unitarios y de integración del backend
#   frontend     npm ci, lint y build
#   integracion  docker compose up (Postgres + backend + nginx) y la prueba de integración contra eso
#
# Los jobs de los otros frentes (mutación, Sonar, dependencias, E2E, ZAP) se suman como jobs nuevos en
# este mismo archivo, sin tocar estos.

name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # todo el historial, no solo el último commit
      - name: Instalar gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks sobre todo el historial
        run: gitleaks git --log-opts="--all" --redact -f sarif -r gitleaks.sarif --exit-code 1 .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks
          path: gitleaks.sarif

  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: mvn verify
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-backend
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
            backend/**/target/site/jacoco*/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  integracion:
    name: Integración (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PALCO_DIR_LOGS: ./logs
      PALCO_LOG: logs/server.log
      JBOSS_CLI: scripts/qa/jboss-cli-docker.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Secretos de esta corrida
        # Nunca están en el repo: se generan acá y se le pasan al compose y a la prueba.
        run: |
          secreto=$(openssl rand -hex 32)
          echo "::add-mask::$secreto"
          echo "PALCO_SECRETO_SERVICIOS=$secreto" >> "$GITHUB_ENV"
          mkdir -p logs && chmod 777 logs
      - name: docker compose up (un comando, todo el sistema)
        run: |
          inicio=$(date +%s)
          docker compose up --build --detach --wait --wait-timeout 900
          echo "Levantado en $(( $(date +%s) - inicio )) segundos" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Humo por HTTPS (nginx, cabeceras y los 8 servicios)
        run: |
          curl -skI https://localhost/ | tee cabeceras.txt
          for h in Content-Security-Policy Strict-Transport-Security X-Content-Type-Options Referrer-Policy; do
            grep -qi "^$h:" cabeceras.txt || { echo "Falta la cabecera $h"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 301
          for ruta in usuarios/health eventos/health v1/health v1/pagos/health v1/validacion/health \
                      v1/reventas/health notificaciones/health v1/facturas/health; do
            codigo=$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost/api/$ruta")
            echo "$ruta $codigo"
            test "$codigo" = 200
          done
      - name: Prueba de integración (scripts/pruebas/escenarios.mjs)
        run: node scripts/pruebas/escenarios.mjs
      - name: Control de logs (sin tokens ni DNI de prueba)
        if: always()
        run: |
          if grep -nE 'Bearer [A-Za-z0-9._-]{20,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ' logs/server.log; then
            echo "El log del servidor tiene tokens"; exit 1
          fi
      - name: Estado de los contenedores
        if: always()
        run: docker compose ps && docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integracion
          path: |
            logs/
            compose.log
            cabeceras.txt
      - name: Bajar todo
        if: always()
        run: docker compose down -v
